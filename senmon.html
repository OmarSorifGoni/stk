<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>専門学校情報</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="senmon">
<header>
<div class="lang-switcher" aria-label="Language selector">
    <button class="lang-btn" type="button" data-lang="ja">日本語</button>
    <button class="lang-btn" type="button" data-lang="en">English</button>
</div>
<h1 data-i18n="pageTitle.senmon">専門学校情報</h1>
</header>
<nav>
<a href="index.html" data-i18n="nav.home">ホーム</a>
<a href="university.html" data-i18n="nav.university">🎓大学情報</a>
<a href="senmon.html" data-i18n="nav.senmon">🎓専門学校情報</a>
<a href="job.html" data-i18n="nav.job">✨ アルバイト</a>
<a href="life.html" data-i18n="nav.life">🏠生活サポート</a>
<a href="contact.html" data-i18n="nav.contact">📩お問い合わせ</a>
</nav>
<div class="container"></div>
<p id="managedSchoolsStatus" role="status" hidden></p>
<script src="lang.js"></script>
<script>
const schoolCards = document.querySelector('.container');
const statusElement = document.getElementById('managedSchoolsStatus');

function createSchoolCard(school, number) {
    const card = document.createElement('article');
    card.className = 'card';

    const heading = document.createElement('h2');
    heading.textContent = `🏫 ${number}. ${school.name}`;
    card.append(heading);

    if (school.region) {
        const location = document.createElement('p');
        location.textContent = `📍 ${school.region}`;
        card.append(location);
    }

    [
        [school.description, ''],
        [school.jlpt_requirement, '📘 '],
        [school.eju_requirement, '📝 '],
        [school.english_requirement, '🌏 '],
        [school.tuition, '💰 学費：']
    ].forEach(([value, prefix]) => {
        if (!value) return;
        const paragraph = document.createElement('p');
        paragraph.textContent = `${prefix}${value}`;
        card.append(paragraph);
    });

    if (school.website_url) {
        const website = document.createElement('a');
        website.className = 'btn';
        website.href = school.website_url;
        website.target = '_blank';
        website.rel = 'noopener noreferrer';
        website.textContent = '学校Website';
        card.append(website);
    }

    return card;
}

async function loadSchools() {
    try {
        const response = await fetch('public-schools.php?category=%E5%B0%82%E9%96%80%E5%AD%A6%E6%A0%A1', { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '専門学校情報を読み込めませんでした');

        schoolCards.replaceChildren();
        result.schools.forEach((school, index) => {
            schoolCards.append(createSchoolCard(school, index + 1));
        });

        statusElement.hidden = result.schools.length !== 0;
        statusElement.textContent = result.schools.length ? '' : '現在公開中の専門学校情報はありません。';
    } catch (error) {
        statusElement.hidden = false;
        statusElement.textContent = '専門学校情報をデータベースから読み込めませんでした。';
        console.error(error);
    }
}

loadSchools();
</script>
</body>
</html>
