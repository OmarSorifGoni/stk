<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学情報</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="university">
<header>
<div class="lang-switcher" aria-label="Language selector">
    <button class="lang-btn" type="button" data-lang="ja">日本語</button>
    <button class="lang-btn" type="button" data-lang="en">English</button>
</div>
<h1 data-i18n="pageTitle.university">大学情報</h1>
</header>
<nav>
<a href="index.html" data-i18n="nav.home">ホーム</a>
<a href="university.html" data-i18n="nav.university">🎓大学情報</a>
<a href="senmon.html" data-i18n="nav.senmon">🎓専門学校情報</a>
<a href="job.html" data-i18n="nav.job">✨ アルバイト</a>
<a href="life.html" data-i18n="nav.life">🏠生活サポート</a>
<a href="contact.html" data-i18n="nav.contact">📩お問い合わせ</a>
</nav>
<div class="container"></div>
<p id="managedUniversitiesStatus" role="status" hidden></p>
<script src="lang.js"></script>
<script>
const universityCards = document.querySelector('.container');
const statusElement = document.getElementById('managedUniversitiesStatus');

function createUniversityCard(university, number) {
    const card = document.createElement('article');
    card.className = 'card';

    const heading = document.createElement('h2');
    heading.textContent = `🎓 ${number}. ${university.name}`;
    card.append(heading);

    if (university.region) {
        const location = document.createElement('p');
        location.textContent = `📍 ${university.region}`;
        card.append(location);
    }

    [
        [university.description, ''],
        [university.jlpt_requirement, '📘 '],
        [university.eju_requirement, '📝 '],
        [university.english_requirement, '🌏 '],
        [university.tuition, '💰 学費：']
    ].forEach(([value, prefix]) => {
        if (!value) return;
        const paragraph = document.createElement('p');
        paragraph.textContent = `${prefix}${value}`;
        card.append(paragraph);
    });

    if (university.website_url) {
        const website = document.createElement('a');
        website.className = 'btn';
        website.href = university.website_url;
        website.target = '_blank';
        website.rel = 'noopener noreferrer';
        website.textContent = '大学Website';
        card.append(website);
    }

    return card;
}

async function loadUniversities() {
    try {
        const response = await fetch('public-schools.php?category=%E5%A4%A7%E5%AD%A6', { cache: 'no-store' });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '大学情報を読み込めませんでした');

        universityCards.replaceChildren();
        result.schools.forEach((university, index) => {
            universityCards.append(createUniversityCard(university, index + 1));
        });

        statusElement.hidden = result.schools.length !== 0;
        statusElement.textContent = result.schools.length ? '' : '現在公開中の大学情報はありません。';
    } catch (error) {
        statusElement.hidden = false;
        statusElement.textContent = '大学情報をデータベースから読み込めませんでした。';
        console.error(error);
    }
}

loadUniversities();
</script>
</body>
</html>
